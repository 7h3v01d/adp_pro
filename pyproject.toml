[project]
name = "accelerated-downloader-pro"
version = "2.0.0"
description = "A multi-threaded, resumable download manager with a PyQt6 Pro GUI."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Leon Priest", email = "7h3v01d@users.noreply.github.com" },
]
keywords = ["download-manager", "torrent", "pyqt6", "libtorrent", "resumable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "PyQt6>=6.5",
    "requests>=2.31",
    "urllib3>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
# libtorrent is a native C-extension without wheels for every Python/OS combo.
# The app degrades gracefully without it (Downloads works; the Torrents tab
# explains how to enable itself), so it's an opt-in extra rather than a hard
# dependency that would block `pip install` on unsupported platforms.
torrents = [
    "libtorrent>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-mock>=3.11",
    "pytest-timeout>=2.1",
    "libtorrent>=2.0",
]
browser-rig = [
    "PyQt6-WebEngine>=6.5",
]

[project.scripts]
adp-downloader = "adp.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
